<style>

.status{position:absolute;z-index:30;top:0;left:0;right:0;height:calc(34px + var(--safe-top));padding:calc(10px + var(--safe-top)) 27px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:15px;font-weight:650;letter-spacing:.1px;text-shadow:0 1px 8px #0004}.status-right{display:flex;align-items:center;gap:6px}.status svg{width:16px;height:15px;fill:currentColor}.battery{width:23px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor}.battery i{display:block;width:76%;height:100%;border-radius:1px;background:currentColor}

e:nth-child(3n){background:linear-gradient(135deg,#e8bb9e,#9bb3b0)}.photo-tile:nth-child(3n+2){background:linear-gradient(135deg,#4b6592,#c4a6d8)}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#fff;border-radius:13px;margin:8px 0}.setting-row input{accent-color:#087cff}.browser-search{border-radius:25px;background:#fff;border:1px solid #dfe1e6;padding:14px 17px;display:flex;gap:8px;align-items:center}.browser-search input{border:0;outline:none;flex:1;min-width:0;background:transparent;color:#111}.google-mark{font-size:47px;font-weight:600;letter-spacing:-3px;text-align:center;margin:60px 0 28px}.google-mark span:nth-child(1){color:#4285f4}.google-mark span:nth-child(2){color:#ea4335}.google-mark span:nth-child(3){color:#fbbc05}.google-mark span:nth-child(4){color:#4285f4}.google-mark span:nth-child(5){color:#34a853}.google-mark span:nth-child(6){color:#ea4335}.call-button{width:70px;height:70px;border-radius:50%;background:#32c759;color:white;font-size:29px;margin:30px auto;display:grid;place-items:center}

<body>
<div id="device">

<script>

function icon(app){let path=iconPaths[app.key]||'<circle cx="12" cy="12" r="8"/>';let fill=['Calendar','Photos','Notes','Clock','Contacts','Safari'].includes(app.key)?'none':'currentColor';let stroke=['Phone','Messages','Safari','Photos','Camera','Settings','Notes','Calendar','Music','Maps','Clock','Mail','AppStore','YouTube','Contacts','Files'].includes(app.key)?'currentColor':'none';let inner='';
if(app.key==='Calendar')inner='<text x="12" y="17" font-size="10" font-weight="700" text-anchor="middle" fill="#e53935" stroke="none">31</text>';
if(app.key==='YouTube')inner='<path d="m10 9 5 3-5 3z" fill="white" stroke="none"/>';
if(app.key==='Photos')inner='<path d="M12 12c-4-1-5-5-2-6 2-1 4 3 2 6zm0 0c1-4 5-5 6-2 1 2-3 4-6 2zm0 0c4 1 5 5 2 6-2 1-4-3-2-6zm0 0c-1 4-5 5-6 2-1-2 3-4 6-2z" fill="#ff8a00" stroke="none"/>';
if(app.key==='Phone')path='<path d="M7 3.5c-.8-.7-2.3-.2-2.7.8l-1 2.4c-.5 1.2.2 3.7 2.2 6.4 2.3 3 5.3 5.5 8.1 6.5 1.5.5 2.5.4 3.4-.5l1.8-1.9-4-3.1-1.8 1.5c-1.8-.7-4.5-3.4-5.2-5.2l1.5-1.8z"/>';
return '<div class="app-icon" style="background:'+app.color+';color:'+(['Calendar','Photos','Notes','Clock','Safari','Contacts'].includes(app.key)?'#303038':'white')+'"><svg viewBox="0 0 24 24" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+inner+'</svg>'+(app.key==='Messages'?'<span class="badge">2</span>':'')+'</div>'}
function appButton(a){return '<button class="app" data-app="'+a.key+'" aria-label="'+a.name+'">'+icon(a)+'<span class="app-label">'+a.name+'</span></button>'}
$('#app-grid').innerHTML=appInfo.filter(a=>!['Phone','Messages','Safari','Music'].includes(a.key)).map(appButton).join('');
$('#dock').innerHTML=dockApps.map(appButton).join('');
function nowUpdate(){const d=new Date(),time=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('#status-time').textContent=time;$('#lock-clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});const weekday=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()];$('#lock-date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+weekday;$('#home-date').textContent=weekday+', '+(d.getMonth()+1)+'월 '+d.getDate()+'일';$('#widget-day').textContent=d.getDate();$('#widget-month').textContent=(d.getMonth()+1)+'월 · '+weekday}nowUpdate();setInterval(nowUpdate,15000);
let unlocked=false,activeApp=null,brightness=100;const store={notes:JSON.parse(localStorage.getItem('hakios_notes')||'[]'),messages:JSON.parse(localStorage.getItem('hakios_messages')||'[{"text":"오늘 뭐 해?","out":false},{"text":"그냥 집에 있어!","out":true}]'),contacts:JSON.parse(localStorage.getItem('hakios_contacts')||'[]'),searches:JSON.parse(localStorage.getItem('hakios_searches')||'[]')};
function save(k){localStorage.setItem('hakios_'+k,JSON.stringify(store[k]))}
function unlock(){unlocked=true;device.classList.add('unlocked');}
function lock(){unlocked=false;device.classList.remove('unlocked');closeApp();closeShade()}
function openShade(){closeApp();$('#shade').classList.add('open')}
function closeShade(){$('#shade').classList.remove('open')}
function showToast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function openApp(key){closeShade();activeApp=key;let title=appInfo.find(a=>a.key===key)?.name||key;$('#app-title').textContent=title;appContent.innerHTML=renderApp(key);$('#app-window').classList.add('open');if(key==='Safari')setTimeout(()=>$('#web-search')?.focus(),100)}
function closeApp(){$('#app-window').classList.remove('open');activeApp=null}
document.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b){openApp(b.dataset.app)}});
$('#app-close').onclick=closeApp;$('#app-back').onclick=closeApp;$('#home-indicator').addEventListener('click',()=>{if($('#shade').classList.contains('open'))closeShade();else if($('#app-window').classList.contains('open'))closeApp();else if(!unlocked)unlock()});
$('#close-shade').onclick=closeShade;$('#shade-lock').onclick=lock;$('#shade-settings').onclick=()=>openApp('Settings');
$('#flashlight').onclick=()=>showToast('손전등은 시뮬레이션에서 지원되지 않아요');$('#camera-shortcut').onclick=()=>{unlock();openApp('Camera')};
$('#island').onclick=()=>$('#island').classList.toggle('expanded');
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{b.classList.toggle('active');let sm=b.querySelector('small');sm.textContent=b.classList.contains('active')?'켬':'끔'});
$('#brightness').oninput=e=>{brightness=+e.target.value;$('#wallpaper').style.filter='brightness('+(brightness/100)+') saturate(1.15)';$('#brightness-label').textContent=brightness+'%'};
$('#volume').oninput=e=>$('#volume-label').textContent=e.target.value+'%';
$('#search-pill').onclick=()=>openApp('Safari');
let touchStartY=0,touchStartX=0;device.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;touchStartX=e.touches[0].clientX},{passive:true});
device.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-touchStartY,dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dy)<55)return;if(touchStartY<100&&dy>60){if(unlocked)openShade();else showToast('위로 쓸어올려 잠금을 해제하세요')}else if(dy< -65){if(!unlocked)unlock();else if($('#shade').classList.contains('open'))closeShade();else if($('#app-window').classList.contains('open'))closeApp()}},{passive:true});
let mouseStartY=0;device.addEventListener('mousedown',e=>mouseStartY=e.clientY);device.addEventListener('mouseup',e=>{let dy=e.clientY-mouseStartY;if(mouseStartY<100&&dy>70&&unlocked)openShade();else if(dy< -70&&!unlocked)unlock()});
function renderApp(key){
if(key==='Notes')return '<h1>메모</h1><input class="field" id="note-title" placeholder="제목"><textarea class="field" id="note-body" rows="4" placeholder="메모를 입력하세요"></textarea><button class="primary" id="save-note">저장</button><div id="note-list">'+store.notes.map((n,i)=>'<div class="list-item"><button data-del-note="'+i+'">삭제</button><b>'+escapeHtml(n.title||'새로운 메모')+'</b><br>'+escapeHtml(n.body)+'</div>').join('')+'</div>';
if(key==='Messages')return '<h1>메시지</h1><p class="muted">시뮬레이션 대화 · 이 기기에 저장됩니다.</p><div id="message-list">'+store.messages.map((m,i)=>'<div class="bubble '+(m.out?'out':'in')+'">'+escapeHtml(m.text)+'</div>').join('')+'</div><div style="clear:both"></div><div class="msg-compose"><input id="message-input" placeholder="iMessage"><button id="send-message">↑</button></div>';
if(key==='Contacts')return '<h1>연락처</h1><input class="field" id="contact-name" placeholder="이름"><input class="field" id="contact-phone" placeholder="전화번호"><button class="primary" id="add-contact">연락처 추가</button><div>'+store.contacts.map((c,i)=>'<div class="list-item"><button data-del-contact="'+i+'">삭제</button><b>'+escapeHtml(c.name)+'</b><br><span class="muted">'+escapeHtml(c.phone)+'</span></div>').join('')+'</div>';
if(key==='Safari')return '<div class="google-mark"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><form id="search-form"><div class="browser-search"><span>⌕</span><input id="web-search" placeholder="Google 검색 또는 URL 입력"></div><div style="text-align:center;margin-top:22px"><button class="primary">Google 검색</button></div></form><h3 style="margin-top:35px">최근 검색</h3><div id="search-list">'+store.searches.map((s,i)=>'<div class="list-item" data-search="'+escapeHtml(s)+'">⌕ &nbsp;'+escapeHtml(s)+'</div>').join('')+'</div><p class="muted" style="font-size:12px;margin-top:28px">검색은 화면 미리보기이며 실제 Google 검색 결과를 불러오지는 않습니다.</p>';
if(key==='Settings')return '<h1>설정</h1><div class="setting-row"><span>다크 모드</span><input id="theme-toggle" type="checkbox" checked></div><div class="setting-row"><span>배경화면</span><button class="primary" id="wall-change">변경</button></div><div class="setting-row"><span>잠금 화면으로 돌아가기</span><button id="settings-lock" style="background:none;color:#087cff">잠금</button></div><p class="muted">HakiOS Web · 웹 UI 프로토타입</p>';
if(key==='Camera')return '<h1>카메라</h1><div style="aspect-ratio:3/4;max-height:55vh;background:linear-gradient(145deg,#242b3c,#131720);border-radius:25px;display:grid;place-items:center;color:#ffffffaa;font-size:14px">카메라 미리보기</div><button class="call-button" id="fake-shutter">●</button><p class="muted" style="text-align:center">실제 카메라 촬영은 연결되어 있지 않습니다.</p>';
if(key==='Photos')return '<h1>사진</h1><p class="muted">최근 항목</p><div class="photo-grid">'+Array.from({length:12},(_,i)=>'<div class="photo-tile" style="filter:hue-rotate('+(i*27)+'deg)"></div>').join('')+'</div><p class="muted">예시 이미지 자리표시자입니다.</p>';
if(key==='Phone')return '<h1>전화</h1><div style="text-align:center;padding:25px 0"><div style="font-size:19px;font-weight:600">즐겨찾기</div><p class="muted">연락처 앱에서 사람을 추가해 보세요.</p><button class="primary" id="phone-contacts">연락처 열기</button></div><h3>키패드</h3><div class="photo-grid" style="grid-template-columns:repeat(3,1fr);gap:10px">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>'<button class="primary" style="border-radius:50%;aspect-ratio:1;font-size:24px;background:#e4e5e9;color:#111" data-dial="'+n+'">'+n+'</button>').join('')+'</div><div id="dial-number" style="text-align:center;font-size:23px;margin-top:15px"></div>';
if(key==='Calendar')return '<h1>캘린더</h1><div class="list-item"><div class="muted">'+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long'})+'</div><div style="font-size:54px;font-weight:650">'+new Date().getDate()+'</div><b>오늘</b><p class="muted">예정된 일정이 없습니다.</p></div>';
if(key==='Clock')return '<h1>시계</h1><div class="list-item" style="text-align:center;padding:35px 10px"><div style="font-size:45px;font-weight:250" id="clock-live">--:--:--</div><p class="muted">현재 시간</p></div>';
if(key==='Music')return '<h1>음악</h1><div class="list-item" style="text-align:center;padding:35px 10px"><div style="font-size:60px">♫</div><b>지금 재생 중인 음악 없음</b><p class="muted">이 화면은 음악 앱 UI 미리보기입니다.</p><button class="primary" id="music-play">▶ 재생</button></div>';
if(key==='Mail')return '<h1>메일</h1><div class="list-item">받은 편지함<p class="muted">아직 메일이 없습니다.</p></div>';
if(key==='Maps')return '<h1>지도</h1><div style="height:50vh;border-radius:20px;background:linear-gradient(25deg,#a9c9a7 0 20%,#e5dfc8 20% 35%,#d6e5cf 35% 54%,#f2e6d3 54% 65%,#a6c5d9 65%);display:grid;place-items:center;color:#40536b;font-weight:600">지도 미리보기</div>';
if(key==='AppStore')return '<h1>App Store</h1><div class="list-item"><b>앱 둘러보기</b><p class="muted">앱 스토어 화면 미리보기</p></div>';
if(key==='YouTube')return '<h1>YouTube</h1><input class="field" id="yt-search" placeholder="검색"><button class="primary" id="yt-go">검색</button><div class="list-item" style="margin-top:20px"><div style="height:140px;background:linear-gradient(135deg,#ee4444,#333);border-radius:12px;display:grid;place-items:center;color:white;font-size:45px">▶</div><b>추천 동영상</b><p class="muted">미리보기 콘텐츠</p></div>';
if(key==='Files')return '<h1>파일</h1><div class="list-item">최근 항목<p class="muted">아직 파일이 없습니다.</p></div>';
return '<h1>'+escapeHtml(key)+'</h1><p class="muted">이 앱은 미리보기 상태입니다.</p>';
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
appContent.addEventListener('click',e=>{
if(e.target.id==='save-note'){let title=$('#note-title').value.trim(),body=$('#note-body').value.trim();if(!title&&!body){showToast('메모 내용을 입력하세요');return}store.notes.unshift({title,body});save('notes');openApp('Notes');}
if(e.target.matches('[data-del-note]')){store.notes.splice(+e.target.dataset.delNote,1);save('notes');openApp('Notes')}
if(e.target.id==='send-message'){let input=$('#message-input'),v=input.value.trim();if(!v)return;store.messages.push({text:v,out:true});save('messages');openApp('Messages')}
if(e.target.id==='add-contact'){let name=$('#contact-name').value.trim(),phone=$('#contact-phone').value.trim();if(!name){showToast('이름을 입력하세요');return}store.contacts.push({name,phone});save('contacts');openApp('Contacts')}
if(e.target.matches('[data-del-contact]')){store.contacts.splice(+e.target.dataset.delContact,1);save('contacts');openApp('Contacts')}
if(e.target.id==='settings-lock')lock();
if(e.target.id==='wall-change'){const colors=['linear-gradient(150deg,#111c42,#5d4d91,#d47e87,#18264d)','linear-gradient(145deg,#111,#41495f,#9da8c5)','linear-gradient(145deg,#f4c3b4,#a1b8ec,#4d4b7c)','linear-gradient(145deg,#0b4c5f,#3e8b9c,#e4bc9a)'];let n=+(localStorage.getItem('hakios_wall')||0);n=(n+1)%colors.length;localStorage.setItem('hakios_wall',n);$('#wallpaper').style.background=colors[n];showToast('배경화면을 변경했습니다')}
if(e.target.id==='music-play')showToast('음악 재생은 데모 기능입니다');
if(e.target.id==='phone-contacts')openApp('Contacts');
if(e.target.matches('[data-dial]'))$('#dial-number').textContent+=e.target.dataset.dial;
if(e.target.id==='fake-shutter')showToast('카메라 촬영은 연결되어 있지 않습니다');
if(e.target.id==='yt-go'){let v=$('#yt-search').value.trim();if(v)showToast('검색 미리보기: '+v)}
if(e.target.dataset.search){$('#web-search').value=e.target.dataset.search}
});
appContent.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='message-input')$('#send-message').click()});
appContent.addEventListener('change',e=>{if(e.target.id==='theme-toggle'){device.classList.toggle('light',!e.target.checked);showToast(e.target.checked?'다크 테마':'라이트 테마')}});
appContent.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();const v=$('#web-search').value.trim();if(!v)return;store.searches.unshift(v);store.searches=[...new Set(store.searches)].slice(0,8);save('searches');openApp('Safari');showToast('검색어를 저장했습니다')}})
</script>
</body></html>
